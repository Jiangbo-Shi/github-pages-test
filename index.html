<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GitHub Pages Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          radial-gradient(circle at top left, rgba(52, 211, 153, 0.24), transparent 32rem),
          linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
      }

      main {
        width: min(720px, 100%);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid rgba(23, 32, 51, 0.1);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 24px 80px rgba(23, 32, 51, 0.12);
      }

      .eyebrow {
        margin: 0 0 16px;
        color: #047857;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(36px, 8vw, 68px);
        line-height: 1;
        letter-spacing: 0;
      }

      p {
        max-width: 58ch;
        margin: 24px 0 0;
        color: #465166;
        font-size: 18px;
        line-height: 1.7;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-top: 32px;
        padding: 12px 16px;
        border-radius: 999px;
        background: #dcfce7;
        color: #14532d;
        font-weight: 700;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #16a34a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #111827;
          color: #f8fafc;
        }

        body {
          background:
            radial-gradient(circle at top left, rgba(20, 184, 166, 0.22), transparent 28rem),
            linear-gradient(135deg, #111827 0%, #1f2937 100%);
        }

        main {
          border-color: rgba(255, 255, 255, 0.12);
          background: rgba(15, 23, 42, 0.88);
          box-shadow: 0 24px 80px rgba(0, 0, 0, 0.3);
        }

        p {
          color: #cbd5e1;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">GitHub Pages</p>
      <h1>测试网页已就位</h1>
      <p>
        这是一个用于跑通 GitHub Pages 托管流程的最小静态页面。部署成功后，打开仓库的 Pages 地址就能看到这一页。
      </p>
      <div class="status" aria-label="部署状态示例">
        <span class="dot" aria-hidden="true"></span>
        Ready to deploy
      </div>
    </main>
  </body>
</html>
